name: Debug Warcraft Logs guild progress

on:
  push:
    branches:
      - feature/guild-site-mvp
    paths:
      - ".github/workflows/debug-wcl-guild-progress.yml"
      - "scripts/debug-wcl-guild-progress.ts"
      - "package.json"

permissions:
  contents: read

jobs:
  debug-wcl-guild-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Debug WCL guild progress
        run: npm run debug:wcl-guild-progress
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
