name: Audit owner-scoped raiders

on:
  workflow_dispatch:
    inputs:
      audit_type:
        description: Historical-raider audit to run
        required: true
        type: choice
        default: owner-scope
        options:
          - owner-scope
          - unknown-actors
      owner_characters:
        description: Comma-separated character names that identify the guild owner's raid presence
        required: true
        default: Tengen,Tengenn,Tenngenn,Magegen,Tenmage,Deathgen

permissions:
  contents: read

concurrency:
  group: audit-owner-scoped-raiders
  cancel-in-progress: false

jobs:
  owner-audit:
    if: inputs.audit_type == 'owner-scope'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit report and same-fight scopes
        run: npm run build:historical-attendance
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_HISTORY_CONCURRENCY: 3
          WCL_HISTORY_OWNER_CHARACTERS: ${{ inputs.owner_characters }}

      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: owner-scoped-raider-audit
          path: docs/owner-scoped-raider-audit.json
          if-no-files-found: error

  unknown-actor-audit:
    if: inputs.audit_type == 'unknown-actors'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit unknown actors
        run: npx tsx scripts/audit-unknown-raiders.ts
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}

      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: unknown-raider-audit
          path: docs/unknown-raider-audit.json
          if-no-files-found: error
