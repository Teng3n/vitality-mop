name: Audit unknown historical raiders

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit unknown actors
        run: npx tsx scripts/audit-unknown-raiders.ts
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}

      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: unknown-raider-audit
          path: docs/unknown-raider-audit.json
          if-no-files-found: error
